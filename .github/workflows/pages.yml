# main 에 push 될 때마다 클라이언트를 빌드해 gh-pages 브랜치로 올린다 → GitHub Pages 가 서빙.
# 주소: https://ohgani.github.io/DragonVillage/
# 저장소 Settings → Pages 의 Source 가 "Deploy from a branch: gh-pages / (root)" 여야 한다
# (공개 저장소는 gh-pages 브랜치가 생기면 보통 자동으로 켜진다).
# M0~M1(싱글, 서버 없음)은 정적 페이지로 충분. 서버가 생기는 M2 부터는 별도 호스팅.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # package.json 의 packageManager 버전을 쓴다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_BASE: /DragonVillage/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/client/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
